databases:
  - name: ledgerly-db
    plan: free
    databaseName: finance_dashboard
    user: ledgerly

services:
  - type: web
    name: ledgerly-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerly-db
          property: connectionString
      - key: CLIENT_URL
        value: https://YOUR-VERCEL-PROJECT.vercel.app

  - type: static
    name: ledgerly-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://ledgerly-api.onrender.com/api
